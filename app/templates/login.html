<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ศรศิลป์ กรอบรูป</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#030712'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }
        *, *:before, *:after { box-sizing: inherit; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .btn-glow {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.45);
        }
        .btn-glow:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Ambient Glow Accents -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
    </div>

    <div class="glass-panel w-full max-w-md rounded-3xl p-6 sm:p-8 space-y-6 relative z-10 border border-slate-800">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-amber-400 p-0.5 shadow-xl flex items-center justify-center">
                <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-3xl">
                    🖼️
                </div>
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight pt-1">
                ศรศิลป์ <span class="bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">กรอบรูป</span>
            </h1>
            <p class="text-xs text-slate-400">ระบบจัดการโพสต์เพจและคิวอัตโนมัติ AI</p>
        </div>

        <!-- Alert Notification -->
        {% if error %}
        <div class="p-3.5 bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-semibold rounded-xl flex items-center gap-2">
            <span>⚠️</span> <span>{{ error }}</span>
        </div>
        {% elif info %}
        <div class="p-3.5 bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-semibold rounded-xl flex items-center gap-2 leading-relaxed">
            <span class="text-base flex-shrink-0">⏳</span> <span>{{ info }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">ชื่อผู้ใช้งาน (Username):</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">👤</span>
                    <input type="text" id="username" name="username" required autofocus placeholder="Username"
                           class="w-full pl-10 pr-3.5 py-3 text-xs bg-slate-900 border border-slate-800 rounded-xl text-slate-200 focus:bg-slate-950 focus:border-emerald-500 focus:outline-none transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">รหัสผ่าน (Password):</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 text-sm">🔒</span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-10 py-3 text-xs bg-slate-900 border border-slate-800 rounded-xl text-slate-200 focus:bg-slate-950 focus:border-emerald-500 focus:outline-none transition">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 text-sm">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-glow w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg shadow-emerald-500/25 transition flex items-center justify-center gap-2">
                <span>🔐</span> <span>เข้าสู่ระบบอย่างปลอดภัย</span>
            </button>
        </form>

        

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById("password");
            const eye = document.getElementById("eyeIcon");
            if (pwd.type === "password") {
                pwd.type = "text";
                eye.innerText = "🙈";
            } else {
                pwd.type = "password";
                eye.innerText = "👁️";
            }
        }
    </script>
</body>
</html>
